                <a href="cart.html" class="icon-header cart">

                </a>
            </div>
        </div>
        <!-- 메인헤더 // 모바일에서 검색창 누를때 나타나는 창 -->

            <div class="mobile-search-box">

            </div>
            <div class="mobile-search-recommend">

                        <label class="cart-select-all">
                            <input type="checkbox" class="select-all-checkbox"/>
                            <span>전체선택</span>
                        </label>
                        <button type="button" class="cart-delete-select">선택제품 삭제</button>
                    </div>
                    <!-- 아이템명, 옵션, 가격 -->
                    <div class="cart-empty">
                        <div class="cart-empty-icon">
                            <img src="../image/icon/Icon_shoppingbag.svg"/>
                        </div>

                <!-- 오른쪽 - 결제금액란 -->
                <aside class="cart-summary"> <!-- 메인컨텐츠와 관련있으나 이를 보조하는 영역 -->
                    <h2 class="cart-summary-title">결제 금액</h2>
                    <div class="summary-top">
                        <div class="cart-summary-row">
                            <span>총 상품금액</span>
                            <strong class="summary-product">원</strong> <!-- strong: 내용중에서 중요도가 높은 부분을 의미적으로 강조, 기본적으로 글씨굵기가 굵음 -->

                        <div class="cart-summary-row">
                            <span>총 할인금액</span>
                            <strong class="summary-discount">원</strong>
                        </div>
                        <div class="cart-summary-row">
                            <span>배송비</span>
                            <strong class="summary-delivery">원</strong>
